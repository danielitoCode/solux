name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm install (not ci) while lockfile catches up to adapter-node
      - name: Install
        run: npm install

      - name: Typecheck (svelte-check + tsc)
        run: npm run check

      - name: Unit tests (Vitest)
        run: npm run test

      - name: Build
        run: npm run build
